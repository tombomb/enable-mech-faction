name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach the zip to a GitHub Release on tag pushes

jobs:
  build:
    # Ubuntu is fine: the RimWorld reference assemblies come from NuGet
    # (Krafs.Rimworld.Ref) and net472 builds via Microsoft.NETFramework.ReferenceAssemblies.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build Source/MechFactionEnabler/MechFactionEnabler.csproj -c Release -nologo

      - name: Package mod folder
        run: |
          mkdir -p dist/MechFactionEnabler
          cp -r About 1.6 Languages LICENSE dist/MechFactionEnabler/
          test -f dist/MechFactionEnabler/1.6/Assemblies/MechFactionEnabler.dll
          cd dist && zip -r MechFactionEnabler.zip MechFactionEnabler

      - uses: actions/upload-artifact@v4
        with:
          name: MechFactionEnabler
          path: dist/MechFactionEnabler

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MechFactionEnabler.zip
          generate_release_notes: true
